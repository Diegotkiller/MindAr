<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <!-- CORRECCIÓN: Se quitó el "./" para evitar errores en GitHub Pages y se agregó ?v=1 para limpiar la caché -->
    <a-scene mindar-image="imageTargetSrc: Boxing.mind?v=1;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Tu imagen del target en la carpeta assets -->
        <img id="card" src="assets/Boxing.jpg" />
        
        <!-- CORRECCIÓN CLAVE: Aquí registramos tu archivo box.glb con el ID "modeloBox" -->
        <!-- (Asegúrate en GitHub de que tu archivo termine en .glb y NO en .gbl) -->
        <a-asset-item id="modeloBox" src="assets/box.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-controls></a-camera>
      
      
        <!-- Como tu imagen de boxeo es cuadrada, ajustamos el plano a 1x1 para que no se vea aplastada -->
        <a-plane src="#card" position="0 0 0" height="1" width="1" rotation="0 0 0"></a-plane>
        
        <!-- CORRECCIÓN CLAVE: Cambiamos src a "#modeloBox" para que use tu archivo 3D -->
        <!-- Subimos el scale a 1 1 1 porque 0.005 era para el monito minúsculo de SoftMind. Si tus guantes se ven gigantes, baja este número a 0.2 0.2 0.2 -->
        <!-- CORRECCIÓN CRÍTICA: Se añadió la diagonal de cierre obligatoria (/>) al final de la etiqueta -->
        <a-gltf-model 
          src="#modeloBox" 
          position="0 0 0.15" 
          rotation="0 0 0" 
          scale="1 1 1" 
          animation="property: rotation; to: 0 360 0; dur: 5000; loop: true; easing: linear" />
      

    </a-scene>
  </body>
</html>
