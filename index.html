<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
  </head>
  <body>
    <!-- CORRECCIÓN: Se quitó el "./" del inicio para que GitHub Pages lo encuentre en la raíz -->
    <a-scene mindar-image="imageTargetSrc: Americano.mind?v=15;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <!-- CORRECCIÓN: Se quitó el "./" también aquí -->
        <img id="card" src="assets/Americano.png" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
      
        <!-- El plano del fondo con tu imagen cuadrada -->
        <a-plane src="#card" position="0 0 0" height="1" width="1" rotation="0 0 0"></a-plane>
        
        <!-- El objeto 3D de prueba (Cubo Azul) -->
        <a-box color="blue" position="0 0 0.2" scale="0.2 0.2 0.2" animation="property: rotation; to: 0 360 0; dur: 2500; loop: true; easing: linear" />
      
    </a-scene>
  </body>
</html>
