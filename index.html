<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <!-- Se mantiene tu archivo de tracking cargado correctamente -->
    <a-scene mindar-image="imageTargetSrc: ./Americano.mind?v=11;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <!-- Tu imagen local en GitHub -->
        <img id="card" src="./assets/Americano.png" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
      
        <!-- AJUSTE DE CONFIGURACIÓN: Cambiado a 1x1 porque los códigos QR son totalmente cuadrados -->
        <a-plane src="#card" position="0 0 0" height="1" width="1" rotation="0 0 0"></a-plane>
        
        <!-- NUEVO OBJETO AR: Reemplazamos el avatar de Softmind por un Cubo Azul que gira en 3D -->
        <a-box color="blue" position="0 0 0.2" scale="0.2 0.2 0.2" animation="property: rotation; to: 0 360 0; dur: 2500; loop: true; easing: linear" />
      
    </a-scene>
  </body>
</html>
